<text x="316" y="145" class="over" fill="#65caff">02 / AZURE RESOURCE GROUP</text>
<text x="825" y="145" class="over" fill="#52dbc2">03 / MONITORING</text>
<rect x="294" y="164" width="802" height="566" rx="20" fill="#0e1b2e" stroke="#2a4a68"/>
<text x="318" y="191" class="sub">Dedicated lab boundary · resources managed by Terraform</text>
