<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Azure infrastructure lab architecture</title>
  <desc id="desc">An administrator connects using SSH through a static public IP to a network interface and Ubuntu VM. The subnet NSG allows SSH from one administrator IPv4 address. The VM has a system-assigned identity with Reader access to the lab resource group. Azure Monitor evaluates CPU every minute and sends alerts through an email action group to the lab owner outside the resource group.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#526170" stroke-width="1.2"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #24313d; }
      .title { font-size: 25px; font-weight: 600; }
      .label { font-size: 15px; font-weight: 600; }
      .note { font-size: 13px; fill: #526170; }
      .boundary { fill: none; stroke: #a4afb9; stroke-width: 1; }
      .node { fill: #fff; stroke: #7b8b99; stroke-width: 1; }
      .line { fill: none; stroke: #526170; stroke-width: 1.3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="760" fill="#fff"/>
  <text x="36" y="49" class="title">Azure infrastructure lab</text>
  <text x="36" y="75" class="note">Single Ubuntu VM · Terraform-managed resources · Deployment pending</text>
  <path d="M36 96 H1084" stroke="#d9dfe4"/>
  <rect x="274" y="121" width="810" height="505" class="boundary"/>
  <text x="294" y="148" class="label">Lab resource group</text>
  <rect x="298" y="170" width="458" height="326" fill="#f7f9fb" stroke="#a4afb9"/>
  <text x="318" y="197" class="label">Virtual network</text>
  <text x="318" y="218" class="note">10.20.0.0/16</text>
  <rect x="318" y="240" width="418" height="236" class="boundary" stroke-dasharray="5 4"/>
  <text x="336" y="265" class="note">app-subnet · 10.20.1.0/24</text>
  <rect x="36" y="286" width="206" height="92" class="node"/>
  <text x="52" y="312" class="label">Administrator</text>
  <text x="52" y="334" class="note">Allowlisted IPv4 /32</text>
  <text x="52" y="353" class="note">SSH key authentication</text>
  <rect x="36" y="430" width="206" height="66" class="node"/>
  <text x="52" y="456" class="label">Public IP</text>
  <text x="52" y="478" class="note">Standard · static</text>
  <rect x="338" y="292" width="174" height="70" class="node"/>
  <text x="354" y="318" class="label">Network interface</text>
  <text x="354" y="340" class="note">Dynamic private IP</text>
  <rect x="540" y="292" width="176" height="70" class="node"/>
  <text x="556" y="318" class="label">Subnet NSG</text>
  <text x="556" y="340" class="note">SSH from admin /32</text>
  <rect x="338" y="403" width="378" height="53" class="node" style="fill: #eef5fb; stroke: #3976a8;"/>
  <text x="354" y="429" class="label">Ubuntu 22.04 LTS</text>
  <text x="354" y="451" class="note">Passwords disabled</text>
  <rect x="788" y="220" width="272" height="111" class="node"/>
  <text x="804" y="246" class="label">CPU alert</text>
  <text x="804" y="268" class="note">Azure Monitor · Percentage CPU</text>
  <text x="804" y="287" class="note">Average &gt; 80% for 5 minutes</text>
  <text x="804" y="306" class="note">Evaluated every minute</text>
  <rect x="788" y="403" width="272" height="72" class="node"/>
  <text x="804" y="429" class="label">Email action group</text>
  <text x="804" y="451" class="note">Common alert schema</text>
  <rect x="338" y="538" width="378" height="66" class="node"/>
  <text x="354" y="564" class="label">System-assigned identity</text>
  <text x="354" y="586" class="note">Reader role · lab resource group</text>
  <rect x="788" y="656" width="272" height="64" class="node"/>
  <text x="804" y="682" class="label">Lab owner</text>
  <text x="804" y="704" class="note">Receives alert emails</text>
  <path d="M139 378 V430" class="line"/>
  <text x="153" y="408" class="note">TCP 22</text>
  <path d="M242 463 H282 V327 H338" class="line"/>
  <path d="M425 362 V403" class="line"/>
  <path d="M628 292 V280 H736" fill="none" stroke="#526170" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M716 429 H772 V275 H788" class="line"/>
  <text x="786" y="369" class="note">Alert triggered</text>
  <path d="M924 331 V403" class="line"/>
  <path d="M924 475 V656" class="line"/>
  <text x="937" y="643" class="note">Email</text>
  <path d="M527 456 V538" class="line" stroke-dasharray="4 4"/>
  <path d="M36 737 H1084" stroke="#d9dfe4"/>
  <text x="36" y="572" class="note">Terraform provisions resources.</text>
  <text x="36" y="593" class="note">GitHub Actions validates config.</text>
  <text x="36" y="614" class="note">Single VM; no high availability.</text>
</svg>
