<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
<title id="title">Azure infrastructure lab architecture</title>
<desc id="desc">An administrator connects over SSH from one allowlisted IPv4 address through a Standard public IP and network interface to an Ubuntu VM. A subnet NSG filters traffic. The VM has a system-assigned identity with Reader access scoped to its resource group. Azure Monitor sends CPU alerts through an email action group to the owner. Terraform provisions the resources, and GitHub Actions checks the configuration.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1223"/><stop offset="1" stop-color="#13243c"/></linearGradient>
  <linearGradient id="compute" x2="1" y2="1"><stop stop-color="#123d62"/><stop offset="1" stop-color="#164a75"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8ca9c8" stroke-width="1.5"/></marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .label { font-size: 15px; font-weight: 600; fill: #edf5ff; }
    .sub { font-size: 12px; fill: #b5c9df; }
    .over { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .line { fill: none; stroke: #8ca9c8; stroke-width: 1.7; marker-end: url(#arrow); }
  </style>
</defs>
