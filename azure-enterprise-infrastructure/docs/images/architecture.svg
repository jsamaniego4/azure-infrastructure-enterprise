<rect x="40" y="212" width="218" height="106" rx="12" fill="#182a40" stroke="#a5b4fc" stroke-opacity="0.45"/><rect x="40" y="228" width="3" height="74" rx="1.5" fill="#a5b4fc"/><text x="58" y="235" class="over" fill="#a5b4fc">ACCESS</text><text x="58" y="258" class="label">Administrator</text><text x="58" y="279" class="sub">One allowlisted IPv4 /32</text><text x="58" y="296" class="sub">SSH public-key authentication</text><rect x="40" y="375" width="218" height="86" rx="12" fill="#182a40" stroke="#a5b4fc" stroke-opacity="0.45"/><rect x="40" y="391" width="3" height="54" rx="1.5" fill="#a5b4fc"/><text x="58" y="405" class="label">Standard public IP</text><text x="58" y="426" class="sub">Static administrative endpoint</text><rect x="352" y="332" width="176" height="70" rx="12" fill="#182a40" stroke="#65caff" stroke-opacity="0.45"/><rect x="352" y="348" width="3" height="38" rx="1.5" fill="#65caff"/><text x="370" y="362" class="label">Network interface</text><text x="370" y="383" class="sub">Private IP · dynamic</text><rect x="552" y="332" width="180" height="70" rx="12" fill="#182a40" stroke="#f4bb62" stroke-opacity="0.45"/><rect x="552" y="348" width="3" height="38" rx="1.5" fill="#f4bb62"/><text x="570" y="362" class="label">Subnet NSG</text><text x="570" y="383" class="sub">Allowlisted SSH only</text><rect x="352" y="430" width="380" height="68" rx="12" fill="url(#compute)" stroke="#65caff" stroke-opacity="0.45"/><rect x="352" y="446" width="3" height="36" rx="1.5" fill="#65caff"/><text x="370" y="460" class="label">Ubuntu 22.04 VM</text><text x="370" y="481" class="sub">System-assigned identity · passwords disabled</text><rect x="800" y="232" width="270" height="100" rx="12" fill="#182a40" stroke="#52dbc2" stroke-opacity="0.45"/><rect x="800" y="248" width="3" height="68" rx="1.5" fill="#52dbc2"/><text x="818" y="255" class="over" fill="#52dbc2">DETECT</text><text x="818" y="278" class="label">Azure Monitor</text><text x="818" y="299" class="sub">Platform metric: